services:
  # =========================================================================
  # Edge Reverse Proxy: Caddy 2 (Auto-HTTPS + WebSocket Upgrade Support)
  # =========================================================================
  caddy:
    image: caddy:2-alpine
    container_name: partshop-caddy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - partshop-network

  # =========================================================================
  # Frontend Service: Next.js 16 Standalone (Production)
  # =========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    image: ${FRONTEND_IMAGE:-partshop-frontend:latest}
    container_name: partshop-frontend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api/v1}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - partshop-network

  # =========================================================================
  # Backend Service: FastAPI Production Runner (Non-Root, No Reload)
  # =========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    image: ${BACKEND_IMAGE:-partshop-backend:latest}
    container_name: partshop-backend
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - ENVIRONMENT=production
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER is required in production}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in production}
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB is required in production}
      - SECRET_KEY=${BACKEND_SECRET_KEY:?BACKEND_SECRET_KEY is required in production}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,https://localhost}
      - CORS_ORIGIN_REGEX=${CORS_ORIGIN_REGEX:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - partshop-network

  # =========================================================================
  # Database Service: PostgreSQL 16 Alpine (Internal Network Only)
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: partshop-postgres
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required in production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in production}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required in production}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - partshop-network

# =========================================================================
# Shared Network & Persistent Volumes
# =========================================================================
networks:
  partshop-network:
    name: partshop-network
    driver: bridge

volumes:
  pgdata:
    name: partshop-pgdata
    driver: local
  caddy_data:
    name: partshop-caddy-data
    driver: local
  caddy_config:
    name: partshop-caddy-config
    driver: local
